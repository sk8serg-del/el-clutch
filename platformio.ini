; PlatformIO Project Configuration File
;
; Плата определяет железо (см. src/hw.h):
;   seeed_xiao_esp32c3     — GEN1_C3: плата CLUTCH, встроенный АЦП + MCP4725
;   seeed_xiao_esp32s3     — GEN2_S3: плата CLUTCH_CAN, ADS1115 + MCP4728
;   seeed_xiao_esp32c3_can — GEN2_C3: плата CLUTCH_CAN с XIAO ESP32-C3

[common]
framework = arduino
board_build.partitions = partitions.csv
extra_scripts = post:copy_firmware.py
lib_deps =
	GyverFilters
	InterpolationLib

[env:seeed_xiao_esp32c3]
platform = espressif32@6.13.0
board = seeed_xiao_esp32c3
extends = common
lib_deps =
	${common.lib_deps}
	Adafruit MCP4725

[env:seeed_xiao_esp32s3]
platform = espressif32@6.13.0
board = seeed_xiao_esp32s3
extends = common
lib_deps =
	${common.lib_deps}
	Adafruit BusIO
	Adafruit MCP4728

[env:seeed_xiao_esp32c3_can]
platform = espressif32@6.13.0
board = seeed_xiao_esp32c3
extends = common
build_flags = -DHW_C3_CAN
lib_deps =
	${common.lib_deps}
	Adafruit BusIO
	Adafruit MCP4728
