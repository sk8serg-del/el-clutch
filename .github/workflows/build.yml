name: Build Firmware

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'platformio.ini'
      - 'lib/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware C3
        run: pio run -e seeed_xiao_esp32c3

      - name: Build firmware S3
        run: pio run -e seeed_xiao_esp32s3

      - name: Build firmware C3 on Gen 2 board
        run: pio run -e seeed_xiao_esp32c3_can

      - name: Get firmware version
        id: ver
        run: |
          VER=$(grep -oP '(?<=#define FW_VERSION_BASE ")[^"]+' src/StarkClutch.ino)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Version: $VER"

      - name: Rename firmware binaries
        run: |
          # имя файла = поколение платы + чип (с 2.16.13)
          cp .pio/build/seeed_xiao_esp32c3/firmware.bin     GEN1_C3.bin
          cp .pio/build/seeed_xiao_esp32s3/firmware.bin     GEN2_S3.bin
          cp .pio/build/seeed_xiao_esp32c3_can/firmware.bin GEN2_C3.bin

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: "Firmware v${{ steps.ver.outputs.version }}"
          body: "${{ steps.ver.outputs.version }}"
          files: |
            GEN1_C3.bin
            GEN2_S3.bin
            GEN2_C3.bin
          make_latest: true

      - name: Store firmware in web for Pages serving
        run: |
          mkdir -p web/firmware/v${{ steps.ver.outputs.version }}
          cp GEN1_C3.bin GEN2_S3.bin GEN2_C3.bin web/firmware/v${{ steps.ver.outputs.version }}/
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add web/firmware/
          git diff --staged --quiet || git commit -m "ci: store firmware v${{ steps.ver.outputs.version }} [skip ci]"
          # пока шла сборка, в main могли прийти другие коммиты (например, выкладка dev)
          git pull --rebase origin main
          git push
