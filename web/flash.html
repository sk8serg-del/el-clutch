<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stark Clutch — Flash Tool</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; }
    .container { max-width: 500px; margin: 0 auto; }
    h1 { text-align: center; font-size: 22px; margin-bottom: 4px; }
    .subtitle { text-align: center; font-size: 13px; color: #aaa; margin-bottom: 20px; }
    .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); margin-bottom: 12px; }
    label { display: block; font-size: 13px; font-weight: bold; color: #555; margin-bottom: 6px; }
    input[type="file"] { display: block; width: 100%; font-size: 14px; margin-bottom: 14px; box-sizing: border-box; }
    .btn { width: 100%; padding: 12px; font-size: 16px; color: white; border: none; border-radius: 6px; cursor: pointer; margin-bottom: 8px; }
    .btn-latest  { background: #4caf50; }
    .btn-latest:hover  { background: #388e3c; }
    .btn-file    { background: #607d8b; }
    .btn-file:hover    { background: #546e7a; }
    .btn:disabled { background: #aaa; cursor: not-allowed; }
    .note { font-size: 12px; color: #aaa; text-align: center; margin: 4px 0 0; }
    progress { width: 100%; height: 18px; margin-top: 10px; }
    #statusMsg { font-size: 13px; color: #555; text-align: center; min-height: 20px; margin-top: 6px; word-break: break-word; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 14px; color: #555; }
    .checkbox-row input { width: auto; margin: 0; }
    .divider { border: none; border-top: 1px solid #eee; margin: 14px 0; }
    #progressWrap { display: none; }
    .version-line { text-align: center; font-size: 14px; margin: 0 0 14px; color: #555; }
    .version-line b { color: #4caf50; }
    .btn-read { background: #2a86d6; }
    .btn-read:hover { background: #1a6ab6; }
    #serialOut {
      display: none; background: #1e1e1e; color: #d4d4d4;
      font-family: monospace; font-size: 12px;
      padding: 10px; border-radius: 6px; margin-top: 10px;
      max-height: 160px; overflow-y: auto; white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Stark Clutch</h1>
  <p class="subtitle">USB Flash Tool &middot; Chrome / Edge only</p>

  <div class="card">
    <p class="version-line">Latest: <b id="latestVer">loading...</b></p>
    <p class="version-line">Board: <b id="boardInfo" style="color:#555;">detected when you connect</b></p>
    <select id="boardSel" style="width:100%; padding:8px; font-size:14px; border-radius:6px; border:1px solid #ccc; margin-bottom:14px; box-sizing:border-box;"></select>

    <div class="checkbox-row">
      <input type="checkbox" id="eraseNvsCheck">
      <span>Erase NVS (reset all settings &amp; calibration)</span>
    </div>

    <button class="btn btn-latest" id="flashLatestBtn">⬇ Download &amp; Flash Latest</button>

    <hr class="divider">

    <label>or choose .bin file manually</label>
    <input type="file" id="binFile" accept=".bin">
    <button class="btn btn-file" id="flashFileBtn">Flash from File</button>

    <p class="note">Web Serial API &middot; hold BOOT button when prompted</p>

    <hr class="divider">
    <button class="btn btn-read" id="readVerBtn">Read Version from Device</button>
    <p class="note">Connect device, press Read, then press Reset button on board</p>
    <div id="serialOut"></div>

    <div id="progressWrap">
      <hr class="divider">
      <progress id="progressBar" value="0" max="100"></progress>
      <p id="progressTxt" style="text-align:center; font-size:13px; margin:4px 0;">0%</p>
    </div>
    <p id="statusMsg"></p>
  </div>
</div>

<script>
// Страница должна работать одним файлом (например, открытая с Google Drive на телефоне),
// поэтому проверка встроена. Такая же копия есть в соседней странице — менять вместе.
// Прошивка = поколение платы + чип (с 2.16.13). Поколение — метка железа в прошивке
// (характеристика 19b10051, метка STARKFWID в .bin). Новое поколение или новый чип —
// одна строка здесь, сборка в platformio.ini и файл в .github/workflows/build.yml.
const FW_BOARDS = {
  GEN1_C3: { hw: 'GEN1', chip: 'C3', title: 'Gen 1 · XIAO ESP32-C3', parts: 'ESP32 ADC + MCP4725', file: 'GEN1_C3.bin' },
  GEN2_S3: { hw: 'GEN2', chip: 'S3', title: 'Gen 2 · XIAO ESP32-S3', parts: 'ADS1115 + MCP4728',   file: 'GEN2_S3.bin' },
  GEN2_C3: { hw: 'GEN2', chip: 'C3', title: 'Gen 2 · XIAO ESP32-C3', parts: 'ADS1115 + MCP4728',   file: 'GEN2_C3.bin' },
};
const FW_CHIP_IDS = { C3: 0x0005, S3: 0x0009 };           // поле chip_id в заголовке образа
// Метки прошивок до 2.16.13. Такая плата по BLE примет только файл со старой меткой,
// поэтому на новую прошивку её один раз прошивают по USB.
const FW_LEGACY_HW = { CLUTCH: 'GEN1', CLUTCH_CAN: 'GEN2' };
const FW_NEW_LABELS_FROM = '2.16.13';
// dev-копия (tools.bulbaracing.com/dev/, вставляет deploy_dev.py): файлы прошивок лежат
// уровнем выше, проверки страницы можно обойти подтверждением. Плата по BLE всё равно
// проверяет чип и метку сама; по USB проверок на плате нет.
const FW_DEV  = !!window.FW_DEV;
const FW_BASE = window.FW_BASE || '';

function fwNormHw(hw) { return hw ? (FW_LEGACY_HW[hw] || hw) : null; }
function fwBoardKey(hw, chip) {
  const k = fwNormHw(hw) + '_' + chip;
  return FW_BOARDS[k] ? k : null;
}
function fwBoardsForChip(chip) { return Object.keys(FW_BOARDS).filter(k => FW_BOARDS[k].chip === chip); }

// Строка версии прошивки: "2.15.0-S3" → чип
function fwChipFromVersion(version) {
  const m = /-([CS]3)$/.exec((version || '').trim());
  return m ? m[1] : null;
}

// Название чипа от esptool: "ESP32-S3 (revision v0.2)"
function fwChipFromChipName(name) {
  const m = /ESP32-([CS]3)/i.exec(name || '');
  return m ? m[1].toUpperCase() : null;
}

function fwVersionAtLeast(version, min) {
  const a = version.split('.').map(Number), b = min.split('.').map(Number);
  for (let i = 0; i < 3; i++) {
    if ((a[i] || 0) !== (b[i] || 0)) return (a[i] || 0) > (b[i] || 0);
  }
  return true;
}

// Примерное оставшееся время по средней скорости с начала записи. Первые секунды
// скорость ещё не устоялась, поэтому оценки нет. Если счётчик пошёл заново
// (USB пишет несколько областей подряд), отсчёт начинается заново.
function fwEta(now = () => Date.now()) {
  let startMs = 0, startBytes = 0, last = -1;
  return (written, total) => {
    if (written < last || last < 0) { startMs = now(); startBytes = written; }
    last = written;
    const elapsed = (now() - startMs) / 1000, done = written - startBytes;
    if (written >= total || elapsed < 2 || done <= 0) return '';
    const left = Math.round((total - written) * elapsed / done / 5) * 5;  // с шагом 5 с, чтобы не прыгало
    if (left < 5) return '  ·  a few seconds left';
    const min = Math.floor(left / 60), sec = left % 60;
    return '  ·  ~' + [min && min + ' min', sec && sec + ' s'].filter(Boolean).join(' ') + ' left';
  };
}

// Что внутри .bin: { chip, hw, rawHw, version, board }; hw — поколение (GEN1/GEN2),
// rawHw — метка как записана в файле. null — неизвестно. Бросает, если это не образ приложения.
function fwInspect(bytes) {
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  // Заголовок образа ESP32 и описание приложения за ним. Полный образ из нескольких
  // частей (merged) начинается с загрузчика, описания приложения в этом месте нет.
  if (bytes.length < 64 || bytes[0] !== 0xE9 || view.getUint32(32, true) !== 0xABCD5432)
    throw new Error('This is not an application firmware file');

  const chipId = view.getUint16(12, true);
  const chip = Object.keys(FW_CHIP_IDS).find(c => FW_CHIP_IDS[c] === chipId) || null;
  const text = new TextDecoder('latin1').decode(bytes);
  let rawHw = null, version = null;
  const id = /STARKFWID\|(\w+)\|([CS]3)\|([\d.]+)\|/.exec(text);
  if (id) { rawHw = id[1]; version = id[3]; }
  else {
    // Прошивки до 2.15.0: явного идентификатора нет, но железо видно по строкам
    if (text.includes('\0CLUTCH_CAN\0') || text.includes('adsErr=')) rawHw = 'CLUTCH_CAN';
    else if (text.includes('\0CLUTCH\0')) rawHw = 'CLUTCH';
    const ver = /(\d+\.\d+\.\d+)-[CS]3/.exec(text);
    version = ver ? ver[1] : null;
  }
  const hw = fwNormHw(rawHw);
  return { chip, hw, rawHw, version, board: hw && chip ? fwBoardKey(hw, chip) : null };
}

// Бросает с понятным сообщением, если файл нельзя шить на эту плату.
// trustedRelease: файл из своих релизов (имя файла уже = плата).
// ble: запись по Bluetooth — плата сама сверит метку файла со своей (deviceLabel):
// до 2.16.14 — только точное совпадение, с 2.16.14 — любое имя своего поколения
// (GEN1 = CLUTCH, GEN2 = CLUTCH_CAN). Плате со старой прошивкой нужен переходный
// файл со старой меткой (firmware/CLUTCH_C3/CLUTCH_v2.16.14_C3.bin и т.п.).
const FW_LEGACY_ALIAS_FROM = '2.16.14';
function fwBleAccepts(fileLabel, deviceLabel, deviceVersion) {
  if (!fileLabel || !deviceLabel) return true;   // без метки плата не проверяет
  if (fileLabel === deviceLabel) return true;
  return !!(deviceVersion && fwVersionAtLeast(deviceVersion, FW_LEGACY_ALIAS_FROM)
            && fwNormHw(fileLabel) === fwNormHw(deviceLabel));
}
function fwAssertFits(bytes, board, { trustedRelease = false, ble = false, deviceVersion = null, deviceLabel = null } = {}) {
  const target = FW_BOARDS[board];
  if (!target) throw new Error('Cannot determine the connected board, flashing is blocked');
  const info = fwInspect(bytes);
  if (info.chip !== target.chip)
    throw new Error(`Wrong firmware: this file is for ${info.chip ? 'ESP32-' + info.chip : 'another chip'}, connected board is ${target.title}`);
  if (info.hw && info.hw !== target.hw)
    throw new Error(`Wrong firmware: this file is for ${info.hw} hardware, connected board is ${target.title}`);
  if (ble && !fwBleAccepts(info.rawHw, deviceLabel, deviceVersion))
    throw new Error(`Over Bluetooth this board (firmware ${deviceVersion || '?'}, label ${deviceLabel}) accepts only ` +
                    `${deviceLabel} files. ` + (!FW_DEV
                      ? 'Update it once over USB (Flash Tool), after that Bluetooth updates work'
                      : FW_LEGACY_HW[deviceLabel]
                      ? `Flash the transition firmware ${deviceLabel}_v${FW_LEGACY_ALIAS_FROM} first, or update over USB`
                      : `Update it to ${FW_LEGACY_ALIAS_FROM} or newer first, or use USB`));
  if (!info.hw && !trustedRelease) {
    const e = new Error(`This old firmware file does not say which hardware it is for (this board is ${target.title})`);
    e.unknownHardware = true;  // чип совпал, железо неизвестно: решает пользователь
    throw e;
  }
  return info;
}

// То же, но старый файл без метки железа можно прошить после подтверждения.
// Файл для другого чипа или с чужой меткой не прошивается никогда.
function fwCheckWithConfirm(bytes, board, options) {
  try {
    return fwAssertFits(bytes, board, options);
  } catch(e) {
    const target = FW_BOARDS[board];
    // dev: любое несовпадение, кроме чипа (другой чип не загрузится вообще), — на усмотрение
    if (FW_DEV && target && !/is for (ESP32-|another chip)/.test(e.message)) {
      if (confirm(`DEV: ${e.message}.\n\n` + (options && options.ble
          ? 'Over Bluetooth the board itself still refuses another hardware label.\n\n' : '') +
          'Flash anyway?')) return fwInspect(bytes);
      throw e;
    }
    const ok = e.unknownHardware && confirm(
      `This old firmware file does not say which hardware it is for.\n` +
      `Connected board: ${target.title} (${target.parts}).\n\n` +
      `Flash only if you are sure this file is for this board. Press OK to flash.`);
    if (!ok) throw e;
    return fwInspect(bytes);
  }
}

// USB: чип известен точно, а поколение — нет (C3 стоит и на Gen 1, и на Gen 2).
// Если на этом чипе бывает несколько плат, пользователь выбирает плату сам:
// прошивка от другого поколения пишет в чужой ЦАП, угадывать по файлу нельзя.
function fwUsbBoard(chip, selectedKey) {
  const keys = fwBoardsForChip(chip);
  if (!keys.length) throw new Error(`ESP32-${chip || '?'} is not a supported board`);
  if (selectedKey) {
    if (!FW_BOARDS[selectedKey] || FW_BOARDS[selectedKey].chip !== chip)
      throw new Error(`Selected board is ${FW_BOARDS[selectedKey] ? FW_BOARDS[selectedKey].title : selectedKey}, but the connected chip is ESP32-${chip}`);
    return selectedKey;
  }
  if (keys.length === 1) return keys[0];
  throw new Error(`ESP32-${chip} is used on ${keys.map(k => FW_BOARDS[k].title.split(' · ')[0]).join(' and ')} boards: choose your board above and try again`);
}

// Выпадающий список плат для USB: «Auto» + все платы
function fwFillBoardSelect(sel) {
  sel.innerHTML = '<option value="">Board: detect by chip</option>' +
    Object.keys(FW_BOARDS).map(k => `<option value="${k}">${FW_BOARDS[k].title} (${FW_BOARDS[k].parts})</option>`).join('');
}
</script>
<script>
  let latestVersion = '';
  fwFillBoardSelect(document.getElementById('boardSel'));

  fetch(FW_BASE + 'firmware_version.txt?_=' + Date.now())
    .then(r => r.ok ? r.text() : '')
    .then(t => {
      // Показываем только номер версии: вместо файла может прийти страница ошибки
      latestVersion = /^\d+\.\d+\.\d+$/.test(t.trim()) ? t.trim() : '';
      document.getElementById('latestVer').textContent = latestVersion || '—';
    })
    .catch(() => {
      document.getElementById('latestVer').textContent = '—';
    });

  // Мобильные браузеры не умеют работать с USB
  if (!('serial' in navigator)) {
    document.querySelectorAll('.btn').forEach(b => { b.disabled = true; });
    document.getElementById('statusMsg').textContent =
      'USB flashing needs Chrome or Edge on a computer. On a phone, update over Bluetooth in Settings.';
  }

  // getFirmware(board) вызывается, когда чип уже определён: чужой файл до записи не доходит
  async function doFlash(getFirmware, checkOptions) {
    const status   = document.getElementById('statusMsg');
    const bar      = document.getElementById('progressBar');
    const pct      = document.getElementById('progressTxt');
    const eraseNvs = document.getElementById('eraseNvsCheck').checked;

    document.getElementById('progressWrap').style.display = 'block';
    bar.value = 0; pct.textContent = '0%'; status.textContent = '';

    if (!('serial' in navigator)) throw new Error('Web Serial not supported — use Chrome or Edge');

    status.textContent = 'Loading flash tool...';
    if (typeof globalThis.Buffer === 'undefined') {
      const { Buffer } = await import('https://esm.run/buffer@6.0.3');
      globalThis.Buffer = Buffer;
    }
    const mod = await import('https://cdn.jsdelivr.net/npm/esptool-js@0.4.3/bundle.js');
    const ESPLoader = mod.ESPLoader ?? mod.default?.ESPLoader;
    const Transport  = mod.Transport  ?? mod.default?.Transport;
    if (!ESPLoader || !Transport) throw new Error('esptool-js: ESPLoader/Transport not found');

    const terminal = {
      clean: () => {},
      writeLine: (m) => { console.log('[esptool]', m); status.textContent = m; },
      write:     (m) => { console.log('[esptool]', m); }
    };

    status.textContent = 'Select USB port — hold BOOT button on device...';
    const port = await navigator.serial.requestPort();
    const transport = new Transport(port, true);

    let esploader;
    try      { esploader = new ESPLoader({ transport, baudrate: 460800, terminal }); }
    catch(e) { esploader = new ESPLoader(transport, 460800, terminal); }

    status.textContent = 'Connecting...';
    const chip = typeof esploader.main === 'function'
      ? await esploader.main()
      : await esploader.main_fn();

    let firmwareData;
    try {
      // C3 стоит и на Gen 1, и на Gen 2: тогда плату выбирает пользователь (список выше
      // или «Read Version from Device»), по одному чипу её не отличить
      const board = fwUsbBoard(fwChipFromChipName(chip), document.getElementById('boardSel').value);
      const target = FW_BOARDS[board];
      document.getElementById('boardInfo').textContent = `${target.title} (${target.parts})`;
      firmwareData = await getFirmware(board);
      const info = fwCheckWithConfirm(firmwareData, board, checkOptions);
      status.textContent = `${info.hw || 'Hardware not confirmed'} ${info.version || ''} — writing to ${target.title}`;
    } catch(e) {
      await transport.disconnect().catch(() => {});
      throw e;
    }

    let binaryStr = '';
    for (let i = 0; i < firmwareData.length; i += 0x8000)
      binaryStr += String.fromCharCode.apply(null, firmwareData.subarray(i, i + 0x8000));

    const fileArray = [];
    if (eraseNvs) {
      status.textContent = 'Erasing NVS...';
      const nvsBlank = new Uint8Array(0x5000).fill(0xFF);
      let nvsStr = '';
      for (let i = 0; i < nvsBlank.length; i += 0x8000)
        nvsStr += String.fromCharCode.apply(null, nvsBlank.subarray(i, i + 0x8000));
      fileArray.push({ data: nvsStr, address: 0x9000 });
    }
    // otadata: 0xe000, size 0x2000 — стёртый выбор слота, плата загрузится с app0, куда идёт запись.
    // Иначе после BLE-обновления активным остался бы app1 со старой прошивкой.
    fileArray.push({ data: '\xFF'.repeat(0x2000), address: 0xe000 });
    fileArray.push({ data: binaryStr, address: 0x10000 });

    status.textContent = `${chip} — writing...`;
    const eta = fwEta();
    await esploader.writeFlash({
      fileArray,
      flashSize: 'keep', flashMode: 'keep', flashFreq: 'keep',
      eraseAll: false, compress: true,
      reportProgress: (idx, written, total) => {
        const p = Math.round(written / total * 100);
        bar.value = p;
        pct.textContent = `${p}%  ·  ${(written/1024).toFixed(0)} / ${(total/1024).toFixed(0)} KB` + eta(written, total);
      }
    });

    await esploader.hardReset();
    await transport.disconnect();
    bar.value = 100; pct.textContent = '100%';
    status.textContent = '✓ Done! Device rebooting...';
  }

  async function withBtn(btnId, fn) {
    const btn = document.getElementById(btnId);
    btn.disabled = true;
    document.getElementById('flashLatestBtn').disabled = true;
    document.getElementById('flashFileBtn').disabled = true;
    try {
      await fn();
    } catch(e) {
      document.getElementById('statusMsg').textContent = '✗ ' + e.message;
      console.error(e);
    } finally {
      btn.disabled = false;
      document.getElementById('flashLatestBtn').disabled = false;
      document.getElementById('flashFileBtn').disabled = false;
    }
  }

  document.getElementById('flashLatestBtn').addEventListener('click', () => {
    withBtn('flashLatestBtn', async () => {
      const status = document.getElementById('statusMsg');
      await doFlash(async (board) => {
        status.textContent = 'Downloading firmware...';
        const resp = await fetch(FW_BASE + FW_BOARDS[board].file + '?_=' + Date.now());
        if (!resp.ok) throw new Error('Download failed: ' + resp.status);
        const data = new Uint8Array(await resp.arrayBuffer());
        status.textContent = `Downloaded ${(data.byteLength / 1024).toFixed(0)} KB`;
        return data;
      }, { trustedRelease: true });
    });
  });

  document.getElementById('flashFileBtn').addEventListener('click', () => {
    const file = document.getElementById('binFile').files[0];
    if (!file) { alert('Select a .bin file first'); return; }
    withBtn('flashFileBtn', async () => {
      const data = new Uint8Array(await file.arrayBuffer());
      await doFlash(() => data);
    });
  });

  document.getElementById('readVerBtn').addEventListener('click', async () => {
    const btn = document.getElementById('readVerBtn');
    const out = document.getElementById('serialOut');
    if (!('serial' in navigator)) { alert('Web Serial not supported — use Chrome or Edge'); return; }

    btn.disabled = true;
    out.style.display = 'block';
    out.textContent = 'Connecting...';

    let port, reader;
    try {
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 115200 });
      // автоматический сброс через RTS → EN pin
      await port.setSignals({ requestToSend: true,  dataTerminalReady: false });
      await new Promise(r => setTimeout(r, 100));
      await port.setSignals({ requestToSend: false, dataTerminalReady: false });
      out.textContent = 'Resetting...';

      reader = port.readable.getReader();
      const textDecoder = new TextDecoder();

      let buf = '';
      const timeout = setTimeout(() => { reader.cancel(); }, 8000);

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += textDecoder.decode(value, { stream: true });

        // с 2.13.0 в начале загрузки: [BOOT] board=GEN2 fw=2.16.13-S3 (до 2.16.13 — CLUTCH / CLUTCH_CAN)
        const bootMatch = buf.match(/\[BOOT\] board=(\w+) fw=([\w.\-]+)/);
        if (bootMatch) {
          const key = fwBoardKey(bootMatch[1], fwChipFromVersion(bootMatch[2]));
          const target = FW_BOARDS[key];
          clearTimeout(timeout);
          out.textContent = `Board: ${target ? target.title : 'unknown'}\nHardware: ${bootMatch[1]}\nFirmware: ${bootMatch[2]}`;
          document.getElementById('boardInfo').textContent = target ? `${target.title} (${target.parts})` : bootMatch[1];
          if (key) document.getElementById('boardSel').value = key;   // для «Flash» ниже
          break;
        }

        // ищем версию в boot сообщении: [OK] Stark Clutch v2.8.1-C3 ready.
        const okMatch = buf.match(/\[OK\] Stark Clutch (v[\w.\-]+) ready/);
        if (okMatch) {
          clearTimeout(timeout);
          out.textContent = 'Firmware: ' + okMatch[1];
          break;
        }

        // запасной вариант — из потока данных: FW:2.8.1-C3
        const fwMatch = buf.match(/FW:([\w.\-]+)/);
        if (fwMatch) out.textContent = 'Firmware: ' + fwMatch[1] + ' (reading boot log...)';
      }
    } catch(e) {
      if (!e.message.includes('cancelled')) out.textContent = '✗ ' + e.message;
      else if (!out.textContent.startsWith('Firmware')) out.textContent = 'Firmware: 1.0';
    } finally {
      try { await reader.cancel(); reader.releaseLock(); } catch(e) {}
      try { await port.close(); } catch(e) {}
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
